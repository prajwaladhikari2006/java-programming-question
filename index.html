    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function terminalText(output, pkg, file, isFirst) {
      let compile;
      let run;

      if (output.x) {
        const [first, second] = output.x.replaceAll(OLD_PROMPT, PROMPT).split("\n\n");
        compile = first;
        run = second;
      } else {
        const flag = pkg ? "-d . " : "";
        const name = pkg ? `${pkg}.${output.m}` : output.m;
        compile = `${PROMPT}javac ${flag}${file}.java`;
        run = `${PROMPT}java ${name}\n${output.t}`;
      }

      return isFirst ? `${SESSION_START}\n\n${compile}\n\n${run}` : run;
    }

    function createCard(topic, index) {
      const card = el("button", "card");
      const heading = el("h3");
      heading.append(el("span", "", topic.n), el("span", "", "›"));
      card.append(heading, el("small", "", `${topic.c} practice problems`));
      card.onclick = () => showTopic(index);
      return card;
    }

    function createQuestion(topicIndex, number, [id, text, rawCode, fileName]) {
      const category = PACKAGES[topicIndex];
      const pkg = category ? `${PACKAGE_ROOT}.${category}` : null;
      const file = fileName || FILES[topicIndex];
      const code = pkg ? `package ${pkg};\n\n${rawCode}` : rawCode;
      const box = el("div", "question");

      const heading = el("h4");
      heading.append(el("b", "", `${number}.`), el("span", "", text));
      heading.onclick = () => box.classList.toggle("open");

      const fileBar = el("div", "file-bar");
      fileBar.append(el("span", "", fileName ? `Code: ${fileName}` : `Code: ${file}.java`));

      const inner = el("div");
      inner.append(fileBar, el("pre", "", code));

      const output = outputs[`${topicIndex}-${id}`];
      if (output) {
        const terminal = terminalText(output, pkg, file, number === 1);
        inner.append(el("div", "file-bar", "Output"), el("pre", "terminal", terminal));
      }

      const answer = el("div", "answer");
      answer.append(inner);
      box.append(heading, answer);
      return box;
    }

    function showHome() {
      subtitle.textContent = "Core Java practice questions with commented solutions and real output.";

      const grid = el("div", "grid");
      topics.forEach((topic, index) => grid.append(createCard(topic, index)));

      scrollTo(0, 0);
    }

    function showTopic(index) {
      const topic = topics[index];

      content.innerHTML = "";

      const back = el("button", "back", "← All topics");
      back.onclick = showHome;

        content.append(el("div", "note", "Solutions for this topic have not been added yet."));
      }

      topic.q.forEach((question, position) => {
        content.append(createQuestion(index, position + 1, question));
      });
      scrollTo(0, 0);
    }
